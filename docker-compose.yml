services:
  postgis:
    image: postgis/postgis:17-3.5
    container_name: gis-postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gis}
      POSTGRES_USER: ${POSTGRES_USER:-gis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gis_password}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gis} -d ${POSTGRES_DB:-gis}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  migrate:
    build:
      context: .
      target: migrator
    container_name: gis-migrate
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-gis}:${POSTGRES_PASSWORD:-gis_password}@postgis:5432/${POSTGRES_DB:-gis}
    depends_on:
      postgis:
        condition: service_healthy
    restart: "no"

  webapp:
    build:
      context: .
      target: runner
    container_name: gis-webapp
    restart: unless-stopped
    # อิมเมจไม่ได้ copy ไฟล์ .env เข้าไป จึงต้องป้อนผ่าน compose
    # อ่านตามลำดับ ตัวหลังทับตัวหน้า -> HEALTH_REDIRECT_URI ของ production ชนะ
    env_file:
      # .env เก็บ AUTH_SECRET กับรหัสผู้ดูแล ขาดไม่ได้ ปล่อยให้ error ตั้งแต่ตอน config
      - path: .env
        required: true
      # .env.production เป็นแค่ตัวทับค่าเฉพาะ production ไม่มีก็รันได้ (ใช้ค่าจาก .env)
      - path: .env.production
        required: false
    environment:
      # environment มีลำดับสูงกว่า env_file เสมอ DATABASE_URL จึงชี้ไป postgis
      # ไม่ถูกทับด้วยค่า localhost ที่อยู่ใน .env ของเครื่อง dev
      DATABASE_URL: postgresql://${POSTGRES_USER:-gis}:${POSTGRES_PASSWORD:-gis_password}@postgis:5432/${POSTGRES_DB:-gis}
    ports:
      - "3017:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgis_data:
